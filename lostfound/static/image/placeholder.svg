<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143A27"/>
      <stop offset="50%" stop-color="#1B4D35"/>
      <stop offset="100%" stop-color="#103222"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C363"/>
      <stop offset="100%" stop-color="#C18422"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(193,132,34,0.18)"/>
      <stop offset="100%" stop-color="rgba(23,69,47,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <rect width="400" height="300" fill="url(#softGlow)"/>

  <!-- Border -->
  <rect x="12" y="12" width="376" height="276" rx="16" fill="none" stroke="rgba(224,173,77,0.35)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Center Icon Group -->
  <g transform="translate(200, 125)">
    <!-- Shield / Badge Backing -->
    <circle r="46" fill="rgba(16,53,34,0.7)" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Camera / Package Icon -->
    <path d="M-22,-6 L-16,-16 L16,-16 L22,-6 L26,-6 C28.2,-6 30,-4.2 30,-2 L30,22 C30,24.2 28.2,26 26,26 L-26,26 C-28.2,26 -30,24.2 -30,22 L-30,-2 C-30,-4.2 -28.2,-6 -26,-6 Z" fill="none" stroke="#F3C363" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="10" r="11" fill="none" stroke="#F3C363" stroke-width="3"/>
    <circle cx="18" cy="1" r="3" fill="#F3C363"/>
  </g>

  <!-- Text -->
  <text x="200" y="205" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFF9EF" letter-spacing="0.5">
    Campus Lost &amp; Found
  </text>
  <text x="200" y="228" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#E8D7B8">
    No Photo Uploaded
  </text>
</svg>
